<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Movimentação - Artinpack</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f9; color: #333; }
        header { background: #1f2d3d; color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 30px; max-width: 600px; margin: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { margin-right: 15px; text-decoration: none; color: #007bff; font-weight: bold; }
        .alert { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <h2>Artinpack</h2>
        <span>Ronaldo94</span>
    </header>
    <div class="container">
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/movimentacao">Registrar Movimentação</a>
        </div>
        
        <h2>Registrar Movimentação de Estoque</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Tipo de Operação</label>
                <select name="tipo">
                    <option value="Entrada">Entrada</option>
                    <option value="Saída">Saída</option>
                </select>
            </div>
            <div class="form-group">
                <label>Produto</label>
                <select name="produto">
                    <option value="Caixa de Papelão Reforçada">Caixa de Papelão Reforçada - ID #102</option>
                    <option value="Fita Adhesiva Padrão">Fita Adhesiva Padrão - ID #103</option>
                    <option value="Plástico Bolha (Metro)">Plástico Bolha (Metro) - ID #104</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quantidade</label>
                <input type="number" name="quantidade" required value="10">
            </div>
            <div class="form-group">
                <label>Data</label>
                <input type="text" name="data" value="28/09/2026" required>
            </div>
            <div class="form-group">
                <label>Responsável</label>
                <input type="text" name="responsavel" value="Ronaldo94" required>
            </div>
            <button type="submit">Confirmar Movimentação</button>
        </form>
    </div>
</body>
</html>
